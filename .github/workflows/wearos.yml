name: Wear OS CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs for the same PR/branch
concurrency:
  group: wearos-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wearOSTest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Wear app
        run: ./gradlew :wearApp:assembleDebug

      # Compose UI tests on the JVM with Robolectric, so no Wear emulator is needed
      - name: Wear Compose UI tests
        run: ./gradlew :wearApp:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wear-test-reports
          path: wearApp/build/reports/tests/
